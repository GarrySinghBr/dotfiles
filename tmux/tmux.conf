set -s escape-time 0
set -g history-limit 1000000

set -g default-terminal "xterm-256color"
set -g mouse on

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-r' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 40
bind -r L resize-pane -R 40
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Remap prefix from 'C-b' to '\'
unbind C-b
set-option -g prefix '`'
bind-key '`' send-prefix

# Change split command keybindings from % and " to | and -
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Change close window command keybinding from & to X
unbind &
bind q killp

# Old binds (prefix + key):
# prefix + c = new-window (tmux default)
# prefix + n = next-window (tmux default)
# prefix + p = previous-window (tmux default)
# prefix + q = kill-pane (custom)

# Alt-based window binds (no prefix needed)
bind -n M-c new-window
bind -n M-n next-window
bind -n M-Right next-window
bind -n M-b previous-window
bind -n M-Left previous-window
bind -n M-q kill-pane
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-s split-window -h
bind -n M-z resize-pane -Z
