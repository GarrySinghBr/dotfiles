set -s escape-time 0
set -g history-limit 1000000

set -g default-terminal "xterm-256color"
set -g mouse on

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-r' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 40
bind -r L resize-pane -R 40
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Prefix is backtick (press twice to type a literal one)
unbind C-b
set-option -g prefix '`'
bind-key '`' send-prefix

# Splits: prefix + | (side by side), prefix + - (stacked)
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Prefix + & (kill-window) is unbound to avoid closing a window by accident
unbind &

# Alt shortcuts (no prefix): c new window, n/b or Left/Right next/previous window,
# s split, q kill pane, r rename window, z zoom pane
bind -n M-c new-window
bind -n M-n next-window
bind -n M-Right next-window
bind -n M-b previous-window
bind -n M-Left previous-window
bind -n M-q kill-pane
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-s split-window -h
bind -n M-z resize-pane -Z
